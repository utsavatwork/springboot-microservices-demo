info:
  name: KeyCloak
  type: http
  seq: 1

http:
  method: POST
  url: "{{keycloakUrl}}/realms/{{realm}}/protocol/openid-connect/token"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: client_id
        value: api-gateway
      - name: username
        value: utsav
      - name: password
        value: password
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
